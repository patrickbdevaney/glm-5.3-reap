# Added 2026-09-26 after two box wedges.
#
# memguard's kill floor is deliberately 250 MB -- a 4000 MB floor and a 900 MB floor each killed
# perfectly healthy stages (see scripts/memguard.sh). A low floor is correct for a guard that
# must not false-positive, but it means the guard is NOT what bounds a runaway. A cgroup ceiling
# is, and it acts before MemAvailable ever reaches the floor.
#
# 72G on a 122 GiB box leaves ~50 GiB for the desktop, the NVIDIA driver page pool (which
# /proc/meminfo attributes to nobody) and any second job. s03_saliency's measured healthy
# working set is ~30 GiB with 54 GiB available, so this is roughly 2.4x headroom over observed
# need -- a ceiling, not a budget.
[Service]
MemoryMax=72G
MemorySwapMax=0
