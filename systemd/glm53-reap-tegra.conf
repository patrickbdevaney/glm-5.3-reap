# The unit sets PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True. Upstream explicitly disables
# expandable segments on Tegra boards (unslothai/unsloth-zoo#1235), and this device reports
# is_integrated=1 -- the GPU allocates from the same physical memory through NvMap, which is the
# case expandable segments' VMM-based growth is not designed for.
#
# An empty assignment clears the inherited value; the s03 orchestrator also pops it from the
# worker environment, so this is belt and braces.
[Service]
Environment=PYTORCH_CUDA_ALLOC_CONF=
